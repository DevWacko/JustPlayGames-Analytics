<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T&amp;T Regulations Test Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a single column "lane" with a road-stripe header; cards only for choices. */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #16191f;
  --muted: #5d6470;
  --line: #d9dcd6;
  --asphalt: #23262c;
  --stripe: #f2b705;
  --accent: #b88400;
  --good: #1d7a45;
  --good-bg: #e3f4ea;
  --bad: #b3261e;
  --bad-bg: #fbe5e3;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418; --surface: #1b1e24; --ink: #eceef0; --muted: #9aa1ab; --line: #2e333b;
    --asphalt: #0b0c0f; --stripe: #f2b705; --accent: #f2b705;
    --good: #5fd08f; --good-bg: #13301f; --bad: #ff8a80; --bad-bg: #3a1714; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121418; --surface: #1b1e24; --ink: #eceef0; --muted: #9aa1ab; --line: #2e333b;
  --asphalt: #0b0c0f; --stripe: #f2b705; --accent: #f2b705;
  --good: #5fd08f; --good-bg: #13301f; --bad: #ff8a80; --bad-bg: #3a1714; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--stripe); outline-offset: 2px; }

header.road {
  background: var(--asphalt); color: #f5f5f2;
  padding-block: 22px 26px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  position: relative; overflow: hidden;
}
header.road::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 10px; height: 4px;
  background: repeating-linear-gradient(90deg, var(--stripe) 0 36px, transparent 36px 64px);
}
.wrap { max-width: 860px; margin: 0 auto; }
header .eyebrow { font-family: var(--display); letter-spacing: .14em; text-transform: uppercase; font-size: 14px; color: var(--stripe); font-weight: 700; }
header h1 { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 7vw, 52px); line-height: 1; margin: 6px 0 8px; text-wrap: balance; }
header p { margin: 0; color: #c5c9cf; max-width: 60ch; }
.home-link { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: inherit; }

main {
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h2 { font-family: var(--display); font-weight: 700; font-size: 28px; margin: 0 0 4px; letter-spacing: .01em; }
.sub { color: var(--muted); margin: 0 0 18px; }

.stats { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 0 0 22px; font-family: var(--display); font-size: 18px; color: var(--muted); }
.stats b { color: var(--ink); font-size: 26px; font-variant-numeric: tabular-nums; margin-right: 4px; }

.big-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-bottom: 30px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 8px; border: 2px solid var(--ink); background: transparent;
  padding: 12px 18px; font-weight: 600; cursor: pointer; min-height: 48px;
}
.btn.primary { background: var(--stripe); border-color: var(--stripe); color: #16191f; }
.btn.primary:hover { filter: brightness(1.05); }
.btn:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.btn.primary:hover { background: var(--stripe); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.big-actions .btn { flex-direction: column; align-items: flex-start; text-align: left; padding: 14px 18px; }
.big-actions .btn small { font-weight: 400; font-size: 14px; opacity: .8; }

.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.cat {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.cat h3 { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 0; line-height: 1.1; }
.cat p { margin: 0; color: var(--muted); font-size: 15px; flex: 1; }
.cat .meta { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); }
.cat .row { display: flex; gap: 8px; flex-wrap: wrap; }
.cat .row .btn { flex: 1; min-height: 42px; padding: 8px 12px; font-size: 15px; }

/* Quiz */
.quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.quiz-top .label { font-family: var(--display); text-transform: uppercase; letter-spacing: .1em; font-size: 14px; color: var(--muted); font-weight: 700; }
.progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 22px; }
.progress > i { display: block; height: 100%; background: var(--stripe); transition: width .25s; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
.qnum { font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 16px; letter-spacing: .06em; }
.qtext { font-size: 21px; font-weight: 600; margin: 4px 0 16px; line-height: 1.35; text-wrap: pretty; }
.qimg { width: 150px; max-width: 100%; margin: 0 0 16px; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
  background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer;
  font-size: 17px;
}
.opt:hover:not([disabled]) { border-color: var(--ink); }
.opt .key {
  flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; border: 2px solid currentColor; font-size: 15px;
}
.opt[disabled] { cursor: default; }
.opt.correct { border-color: var(--good); background: var(--good-bg); color: var(--ink); }
.opt.correct .key { background: var(--good); border-color: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt .tag { margin-left: auto; font-size: 13px; font-weight: 600; white-space: nowrap; padding-left: 8px; }
.opt.correct .tag { color: var(--good); }
.opt.wrong .tag { color: var(--bad); }
.feedback { margin-top: 16px; border-radius: 10px; padding: 14px 16px; border-left: 6px solid; }
.feedback.good { border-color: var(--good); background: var(--good-bg); }
.feedback.bad { border-color: var(--bad); background: var(--bad-bg); }
.feedback strong { display: block; font-family: var(--display); font-size: 22px; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.feedback p { margin: 4px 0 0; }
.qnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 14px; margin-top: 12px; }

/* Results */
.score { font-family: var(--display); font-weight: 800; font-size: clamp(56px, 14vw, 96px); line-height: 1; font-variant-numeric: tabular-nums; }
.verdict { font-family: var(--display); font-size: 24px; font-weight: 700; margin: 4px 0 14px; }
.verdict.good { color: var(--good); } .verdict.bad { color: var(--bad); }
.passbox { display: flex; gap: 16px; align-items: center; border-radius: 12px; padding: 16px 18px; border: 2px solid; margin: 0 0 10px; max-width: 640px; }
.passbox.good { border-color: var(--good); background: var(--good-bg); }
.passbox.bad { border-color: var(--bad); background: var(--bad-bg); }
.passbox .stamp { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: .06em; padding: 2px 12px; border: 3px solid; border-radius: 8px; transform: rotate(-4deg); flex: none; }
.passbox.good .stamp { color: var(--good); } .passbox.bad .stamp { color: var(--bad); }
.passbox strong { font-size: 18px; } .passbox p { margin: 2px 0 0; font-size: 15px; }
.passmark { color: var(--muted); font-size: 14px; margin: 0 0 18px; max-width: 640px; }
.passmark select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.review { display: grid; gap: 12px; margin-top: 24px; }
.ritem { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; gap: 14px; }
.ritem .mini { width: 64px; flex: none; }
.ritem .body { min-width: 0; }
.ritem .q { font-weight: 600; margin-bottom: 4px; }
.ritem .a { font-size: 15px; }
.ritem .a.you { color: var(--bad); }
.ritem .a.ok { color: var(--good); }
.ritem .e { font-size: 15px; color: var(--muted); margin-top: 4px; }

.guides { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-bottom: 20px; }
.guide { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; display: flex; flex-direction: column; }
.guide b { font-family: var(--display); font-size: 20px; line-height: 1.15; }
.guide span { font-size: 14px; color: var(--muted); }
.guide[aria-pressed="true"] { border-color: var(--stripe); background: color-mix(in srgb, var(--stripe) 14%, var(--surface)); }
.cats + h2 { margin-top: 30px; }
.qimg img, .mini img, .signgrid img { display: block; background: #fff; border-radius: 10px; padding: 6px; border: 1px solid var(--line); max-width: 100%; height: auto; }
.signgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.signgrid figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.signgrid figcaption { font-size: 15px; font-weight: 600; line-height: 1.3; }
.sopts { margin: 6px 0 0; padding-left: 22px; list-style: lower-alpha; font-size: 15px; display: grid; gap: 3px; }
.sopts li.ok { color: var(--good); font-weight: 600; }
.sopts .tick { font-size: 13px; white-space: nowrap; }
/* Study list */
.study { display: grid; gap: 10px; }
.filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.reveal { margin-top: 6px; }
.reveal summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 15px; }

.note { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; max-width: 70ch; }
@media (prefers-reduced-motion: reduce) { .progress > i { transition: none; } }
@media (max-width: 480px) {
  .qcard { padding: 16px; }
  .qtext { font-size: 19px; }
  .ritem { flex-direction: column; }
  .passbox { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<header class="road">
  <div class="wrap">
    <button class="home-link" id="homeLink" type="button" aria-label="Back to categories">
      <div class="eyebrow">Trinidad &amp; Tobago · Regulations Exam Practice</div>
      <h1>T&amp;T Regulations Test Trainer</h1>
    </button>
    <p>Multiple-choice practice for the Trinidad and Tobago driver's regulations test, using the questions, road signs and hand signals from the study guide.</p>
  </div>
</header>

<main><div class="wrap" id="app"></div></main>

<script src="data.js"></script>
<script>
(function () {
  var app = document.getElementById("app");
  var GUIDES = window.GUIDES, SIGNS = window.SIGNS, HANDS = window.HANDS;
  var LETTERS = ["A", "B", "C", "D"];
  var MOCK = { mcq: 14, signs: 12, hands: 4 };
  var SIGN_GROUPS = [
    { id: "warning", name: "Danger Warning Signs", blurb: "Red triangles and other signs that warn of a hazard ahead." },
    { id: "regulatory", name: "Regulatory Signs", blurb: "Signs that give orders: stop, give way, no entry, speed limits." },
    { id: "info", name: "Informative Signs", blurb: "Signs that give information and directions." }
  ];

  /* ---------- saved progress (this browser only) ---------- */
  var store = { seen: {}, missed: {}, best: {}, guide: "light", passMark: 80 };
  try { var raw = localStorage.getItem("tt-regs-v2"); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
  function save() { try { localStorage.setItem("tt-regs-v2", JSON.stringify(store)); } catch (e) {} }

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function guide() { for (var i = 0; i < GUIDES.length; i++) if (GUIDES[i].id === store.guide) return GUIDES[i]; return GUIDES[0]; }

  /* ---------- question builders ---------- */
  // Every question: { id, kind, q, img?, o:[...], a:index of correct, tip?, label }
  function mcqQ(g, m) { return { id: g.id + ":" + m.n, kind: "mcq", q: m.q, o: m.o, a: m.a, label: "Study guide no. " + m.n }; }
  function signQ(i) {
    var s = SIGNS[i], names = [], seen = {}; seen[s.name] = 1;
    shuffle(SIGNS.filter(function (x) { return x.g === s.g; })).forEach(function (x) { if (!seen[x.name] && names.length < 3) { seen[x.name] = 1; names.push(x.name); } });
    var o = shuffle([s.name].concat(names));
    return { id: "sign:" + i, kind: "sign", q: "What does this road sign mean?", img: s.img, alt: "Road sign", o: o, a: o.indexOf(s.name), label: SIGN_GROUPS.filter(function (x) { return x.id === s.g; })[0].name };
  }
  function handQ(i) {
    var h = HANDS.signals[i], order = shuffle([0, 1, 2, 3]);
    return { id: "hand:" + i, kind: "hand", q: "How do you signal that " + h.lead + "?", o: order.map(function (k) { return HANDS.options[k]; }), a: order.indexOf(h.a), tip: h.tip, label: "Hand Signals" };
  }
  function range(n) { var r = []; for (var i = 0; i < n; i++) r.push(i); return r; }
  function signIdx(g) { return range(SIGNS.length).filter(function (i) { return SIGNS[i].g === g; }); }

  /* ---------- categories for the chosen study guide ---------- */
  function categories() {
    var g = guide(), n = g.mcq.length, parts = Math.round(n / 21), size = Math.ceil(n / parts), cats = [];
    cats.push({ id: g.id + ":mcq", group: "mcq", name: "All " + n + " questions", blurb: "Every multiple choice question in the study guide, in order.",
      ids: g.mcq.map(function (m) { return g.id + ":" + m.n; }), build: function () { return g.mcq.map(function (m) { return mcqQ(g, m); }); } });
    for (var p = 0; p < parts; p++) (function (p) {
      var slice = g.mcq.slice(p * size, (p + 1) * size);
      cats.push({ id: g.id + ":mcq" + (p + 1), group: "mcq", name: "Questions " + slice[0].n + "–" + slice[slice.length - 1].n, blurb: "A shorter set, so you can learn the guide a part at a time.",
        ids: slice.map(function (m) { return g.id + ":" + m.n; }), build: function () { return slice.map(function (m) { return mcqQ(g, m); }); } });
    })(p);
    SIGN_GROUPS.forEach(function (sg) {
      var idx = signIdx(sg.id);
      cats.push({ id: "signs:" + sg.id, group: "signs", name: sg.name, blurb: sg.blurb, signs: idx,
        ids: idx.map(function (i) { return "sign:" + i; }), build: function () { return shuffle(idx).map(signQ); } });
    });
    cats.push({ id: "hands", group: "hands", name: "Hand Signals", blurb: "The six driver's hand signals and how each one is given.", hands: true,
      ids: range(HANDS.signals.length).map(function (i) { return "hand:" + i; }), build: function () { return shuffle(range(HANDS.signals.length)).map(handQ); } });
    return cats;
  }
  function allIds() { var g = guide(); return g.mcq.map(function (m) { return g.id + ":" + m.n; }).concat(range(SIGNS.length).map(function (i) { return "sign:" + i; }), range(HANDS.signals.length).map(function (i) { return "hand:" + i; })); }
  function buildById(id) {
    var p = id.split(":"), g = guide();
    if (p[0] === "sign") return signQ(+p[1]);
    if (p[0] === "hand") return handQ(+p[1]);
    var m = g.mcq.filter(function (m) { return m.n === +p[1]; })[0];
    return m && p[0] === g.id ? mcqQ(g, m) : null;
  }
  function countRight(ids) { return ids.filter(function (id) { return store.seen[id] === 1; }).length; }

  var state = null;

  /* ---------- HOME ---------- */
  function home() {
    state = null;
    var g = guide(), cats = categories(), ids = allIds();
    var missed = ids.filter(function (id) { return store.missed[id]; });
    var h = '<div class="guides" role="group" aria-label="Which test are you studying for?">';
    GUIDES.forEach(function (x) {
      h += '<button class="guide" type="button" data-guide="' + x.id + '" aria-pressed="' + (x.id === g.id) + '"><b>' + esc(x.name) + '</b><span>' + esc(x.cls) + ' · ' + x.mcq.length + ' questions</span></button>';
    });
    h += '</div>';
    h += '<div class="stats"><span><b>' + g.mcq.length + '</b>multiple choice</span><span><b>' + SIGNS.length + '</b>road signs</span><span><b>' + HANDS.signals.length +
      '</b>hand signals</span><span><b>' + countRight(ids) + '</b>answered correctly</span><span><b>' + missed.length + '</b>to review</span></div>';
    var mockN = MOCK.mcq + MOCK.signs + MOCK.hands;
    h += '<div class="big-actions">' +
      '<button class="btn primary" id="mockBtn" type="button">Take a mock test<small>' + mockN + ' questions: ' + MOCK.mcq + ' multiple choice, ' + MOCK.signs + ' road signs, ' + MOCK.hands + ' hand signals</small></button>' +
      '<button class="btn" id="allBtn" type="button">Practise everything<small>All ' + ids.length + ' questions, signs and signals, shuffled</small></button>' +
      '<button class="btn" id="missBtn" type="button"' + (missed.length ? "" : " disabled") + '>Review my mistakes<small>' + (missed.length ? missed.length + " you got wrong" : "Nothing to review yet") + '</small></button></div>';
    [["mcq", "Multiple choice questions", "The questions and answers from the " + g.cls + " study guide. Options appear in the same order as the guide."],
     ["signs", "Road signs", "All " + SIGNS.length + " road signs from the study guide."],
     ["hands", "Hand signals", ""]].forEach(function (sec) {
      h += '<h2>' + sec[1] + '</h2>' + (sec[2] ? '<p class="sub">' + esc(sec[2]) + '</p>' : '<p class="sub"></p>') + '<div class="cats">';
      cats.filter(function (c) { return c.group === sec[0]; }).forEach(function (c) {
        var n = c.ids.length, m = countRight(c.ids), best = store.best[c.id];
        h += '<article class="cat"><h3>' + esc(c.name) + '</h3><p>' + esc(c.blurb) + '</p>' +
          '<div class="meta"><span>' + n + (c.group === "signs" ? " signs" : c.group === "hands" ? " signals" : " questions") + '</span><span>' + (best != null ? "Best " + best + "%" : "Not tried") + '</span></div>' +
          '<div class="bar" aria-label="' + m + " of " + n + ' answered correctly"><i style="width:' + Math.round(m / n * 100) + '%"></i></div>' +
          '<div class="row"><button class="btn primary" data-quiz="' + c.id + '" type="button">Practise</button><button class="btn" data-study="' + c.id + '" type="button">Study list</button></div></article>';
      });
      h += '</div>';
    });
    h += '<p class="note">The questions, answers, road signs and hand signals are taken from the TTRegs.com printable study guides. They are for your own study. Your progress is saved in this browser only. ' +
      '<button class="chip" id="resetBtn" type="button">Reset progress</button></p>';
    app.innerHTML = h;

    app.querySelectorAll("[data-guide]").forEach(function (b) { b.onclick = function () { store.guide = b.dataset.guide; save(); home(); }; });
    document.getElementById("mockBtn").onclick = function () {
      var list = shuffle(g.mcq).slice(0, MOCK.mcq).map(function (m) { return mcqQ(g, m); })
        .concat(shuffle(range(SIGNS.length)).slice(0, MOCK.signs).map(signQ), shuffle(range(HANDS.signals.length)).slice(0, MOCK.hands).map(handQ));
      start("mock", list, "Mock test");
    };
    document.getElementById("allBtn").onclick = function () { start("all", shuffle(ids.map(buildById)), "Practise everything"); };
    document.getElementById("missBtn").onclick = function () { if (missed.length) start("missed", shuffle(missed.map(buildById)), "Review my mistakes"); };
    var rb = document.getElementById("resetBtn");
    rb.onclick = function () {
      if (rb.dataset.armed) { store.seen = {}; store.missed = {}; store.best = {}; save(); home(); }
      else { rb.dataset.armed = "1"; rb.textContent = "Tap again to erase all progress"; }
    };
    app.querySelectorAll("[data-quiz]").forEach(function (b) {
      b.onclick = function () { var c = cats.filter(function (c) { return c.id === b.dataset.quiz; })[0]; start(c.id, c.build(), c.name); };
    });
    app.querySelectorAll("[data-study]").forEach(function (b) { b.onclick = function () { study(b.dataset.study); }; });
    window.scrollTo(0, 0);
  }

  /* ---------- QUIZ ---------- */
  function start(kind, list, title) { state = { kind: kind, title: title, i: 0, answers: [], items: list.filter(Boolean) }; renderQ(); }

  function renderQ() {
    var q = state.items[state.i], a = state.answers[state.i], answered = a != null, n = state.items.length;
    var h = '<div class="quiz-top"><span class="label">' + esc(state.title) + '</span><button class="btn" id="quitBtn" type="button">End &amp; see results</button></div>';
    h += '<div class="progress" aria-hidden="true"><i style="width:' + ((state.i + (answered ? 1 : 0)) / n * 100) + '%"></i></div>';
    h += '<section class="qcard" aria-live="polite"><div class="qnum">QUESTION ' + (state.i + 1) + ' OF ' + n + ' · ' + esc(q.label.toUpperCase()) + '</div>';
    h += '<div class="qtext">' + esc(q.q) + '</div>';
    if (q.img) h += '<div class="qimg"><img src="' + q.img + '" alt="' + esc(q.alt) + '" width="150" height="150"></div>';
    h += '<div class="opts">';
    q.o.forEach(function (text, k) {
      var cls = "", tag = "";
      if (answered) {
        if (k === q.a) { cls = " correct"; tag = a === k ? "Your answer ✓" : "Correct answer"; }
        else if (a === k) { cls = " wrong"; tag = "Your answer ✗"; }
      }
      h += '<button class="opt' + cls + '" type="button" data-k="' + k + '"' + (answered ? " disabled" : "") + '><span class="key">' + LETTERS[k] + '</span><span>' + esc(text) + '</span>' + (tag ? '<span class="tag">' + tag + '</span>' : "") + '</button>';
    });
    h += '</div>';
    if (answered) {
      var ok = a === q.a;
      h += '<div class="feedback ' + (ok ? "good" : "bad") + '"><strong>' + (ok ? "Correct!" : "Wrong") + '</strong>' +
        (ok ? "" : '<p>The correct answer is ' + LETTERS[q.a] + ': <b>' + esc(q.o[q.a]) + '</b></p>') + (q.tip ? '<p>Tip: ' + esc(q.tip) + '</p>' : "") + '</div>';
    }
    h += '<div class="qnav"><button class="btn" id="prevBtn" type="button"' + (state.i === 0 ? " disabled" : "") + '>← Previous</button>' +
      '<button class="btn primary" id="nextBtn" type="button"' + (answered ? "" : " disabled") + '>' + (state.i === n - 1 ? "See results" : "Next question →") + '</button></div>';
    h += '</section><p class="hint">Tip: press 1–4 (or A–D) to answer and Enter for the next question.</p>';
    app.innerHTML = h;
    app.querySelectorAll(".opt").forEach(function (b) { b.onclick = function () { choose(+b.dataset.k); }; });
    document.getElementById("prevBtn").onclick = function () { if (state.i > 0) { state.i--; renderQ(); } };
    document.getElementById("nextBtn").onclick = next;
    document.getElementById("quitBtn").onclick = results;
    var top = app.querySelector(".quiz-top");
    if (top.getBoundingClientRect().top < 0) top.scrollIntoView();
  }
  function choose(k) {
    if (state.answers[state.i] != null) return;
    var q = state.items[state.i];
    state.answers[state.i] = k;
    if (k === q.a) { store.seen[q.id] = 1; delete store.missed[q.id]; } else { store.seen[q.id] = 0; store.missed[q.id] = 1; }
    save(); renderQ();
  }
  function next() {
    if (state.answers[state.i] == null) return;
    if (state.i < state.items.length - 1) { state.i++; renderQ(); } else results();
  }

  /* ---------- RESULTS ---------- */
  function results() {
    var done = 0, right = 0, wrongs = [];
    state.items.forEach(function (q, i) {
      var a = state.answers[i]; if (a == null) return;
      done++; if (a === q.a) right++; else wrongs.push({ q: q, a: a });
    });
    var pct = done ? Math.round(right / done * 100) : 0;
    if (state.kind.indexOf(":") > 0 || state.kind === "hands") { if (done === state.items.length) { store.best[state.kind] = Math.max(store.best[state.kind] || 0, pct); save(); } }
    var pm = store.passMark || 80;
    var needed = Math.ceil(done * pm / 100), pass = done > 0 && right >= needed;
    var h = '<div class="quiz-top"><span class="label">' + esc(state.title) + ' · Results</span></div>';
    h += '<div class="score">' + right + '/' + done + '</div>';
    h += '<div class="verdict ' + (pass ? "good" : "bad") + '">' + pct + '% correct</div>';
    if (done > 0) {
      h += '<div class="passbox ' + (pass ? "good" : "bad") + '" role="status"><span class="stamp">' + (pass ? "PASS" : "FAIL") + '</span><div><strong>' +
        (pass ? "You would pass the real test with this score." : "You would not pass the real test with this score.") + '</strong><p>' +
        "You needed " + needed + " correct out of " + done + " and got " + right + "." + (pass ? "" : " That is " + (needed - right) + " short.") +
        (done < state.items.length ? " This is based only on the " + done + " of " + state.items.length + " questions you answered; in the real test, unanswered questions count as wrong." : "") +
        '</p></div></div>';
      h += '<p class="passmark"><label for="passMark">Pass mark used:</label> <select id="passMark">';
      [60, 70, 75, 80, 85, 90, 100].forEach(function (v) { h += '<option value="' + v + '"' + (v === pm ? " selected" : "") + '>' + v + '%</option>'; });
      h += '</select> The Licensing Division does not publish its pass mark online, so 80% is an estimate. If your Licensing Office tells you a different one, change it here.</p>';
    } else {
      h += '<p class="sub">You did not answer any questions, so there is no pass or fail result.</p>';
    }
    h += '<div class="row" style="display:flex;gap:10px;flex-wrap:wrap">' +
      (wrongs.length ? '<button class="btn primary" id="retryWrong" type="button">Retry the ' + wrongs.length + ' I got wrong</button>' : "") +
      '<button class="btn" id="again" type="button">Start again</button><button class="btn" id="home2" type="button">All categories</button></div>';
    if (wrongs.length) {
      h += '<h2 style="margin-top:28px">Questions you got wrong</h2><div class="review">';
      wrongs.forEach(function (w) {
        h += '<div class="ritem">' + (w.q.img ? '<div class="mini"><img src="' + w.q.img + '" alt="Road sign" width="64" height="64"></div>' : "") + '<div class="body"><div class="q">' + esc(w.q.q) + '</div>' +
          '<div class="a you">Your answer: ' + esc(w.q.o[w.a]) + '</div><div class="a ok">Correct answer: ' + esc(w.q.o[w.q.a]) + '</div>' +
          (w.q.tip ? '<div class="e">Tip: ' + esc(w.q.tip) + '</div>' : "") + '</div></div>';
      });
      h += '</div>';
    }
    app.innerHTML = h;
    var prev = state;
    function rebuild(list) { return list.map(function (q) { return q.kind === "mcq" ? q : buildById(q.id); }); }
    if (wrongs.length) document.getElementById("retryWrong").onclick = function () { start("retry", shuffle(rebuild(wrongs.map(function (w) { return w.q; }))), prev.title.replace(/ · retry$/, "") + " · retry"); };
    document.getElementById("again").onclick = function () { start(prev.kind, prev.kind.indexOf(":mcq") > 0 ? prev.items : shuffle(rebuild(prev.items)), prev.title); };
    document.getElementById("home2").onclick = home;
    var pmSel = document.getElementById("passMark");
    if (pmSel) pmSel.onchange = function () { store.passMark = +pmSel.value; save(); results(); };
    window.scrollTo(0, 0);
  }

  /* ---------- STUDY LIST ---------- */
  function study(catId) {
    state = null;
    var cats = categories(), c = cats.filter(function (x) { return x.id === catId; })[0] || cats[0];
    var h = '<div class="quiz-top"><span class="label">Study list</span><button class="btn" id="back" type="button">← Categories</button></div>';
    h += '<h2>' + esc(c.name) + '</h2><p class="sub">' + (c.group === "mcq" ? "The correct answer to each question is marked in green, as in the study guide." : c.group === "signs" ? "Learn the name of each sign." : "Learn how each signal is given.") + '</p>';
    h += '<div class="filter">';
    cats.forEach(function (x) { h += '<button class="chip" type="button" data-cat="' + x.id + '" aria-pressed="' + (x.id === c.id) + '">' + esc(x.name) + '</button>'; });
    h += '</div>';
    if (c.group === "mcq") {
      h += '<div class="study">';
      c.build().forEach(function (q) {
        h += '<div class="ritem"><div class="body"><div class="q">' + q.id.split(":")[1] + '. ' + esc(q.q) + '</div><ol class="sopts">';
        q.o.forEach(function (o, k) { h += '<li' + (k === q.a ? ' class="ok"' : "") + '>' + esc(o) + (k === q.a ? ' <span class="tick">✓ correct</span>' : "") + '</li>'; });
        h += '</ol></div></div>';
      });
      h += '</div>';
    } else if (c.group === "signs") {
      h += '<div class="signgrid">';
      c.signs.forEach(function (i) { h += '<figure><img src="' + SIGNS[i].img + '" alt="" width="110" height="110"><figcaption>' + esc(SIGNS[i].name) + '</figcaption></figure>'; });
      h += '</div>';
    } else {
      h += '<div class="study">';
      HANDS.signals.forEach(function (s) {
        h += '<div class="ritem"><div class="body"><div class="q">' + esc(s.name) + '</div><div class="a">To signal that ' + esc(s.lead) + ': ' + esc(HANDS.options[s.a]) + '</div>' + (s.tip ? '<div class="e">Tip: ' + esc(s.tip) + '</div>' : "") + '</div></div>';
      });
      h += '</div>';
    }
    h += '<div class="qnav"><button class="btn primary" id="practise" type="button">Practise this category</button></div>';
    app.innerHTML = h;
    document.getElementById("back").onclick = home;
    document.getElementById("practise").onclick = function () { start(c.id, c.build(), c.name); };
    app.querySelectorAll("[data-cat]").forEach(function (b) { b.onclick = function () { study(b.dataset.cat); }; });
    window.scrollTo(0, 0);
  }

  document.getElementById("homeLink").onclick = home;
  document.addEventListener("keydown", function (e) {
    if (!state || e.metaKey || e.ctrlKey || e.altKey) return;
    if (!app.querySelector(".opts")) return;
    var k = e.key.toUpperCase(), idx = "1234".indexOf(k);
    if (idx < 0) idx = "ABCD".indexOf(k);
    if (idx >= 0 && k.length === 1) {
      var btns = app.querySelectorAll(".opt"); if (btns[idx] && !btns[idx].disabled) btns[idx].click();
    } else if (e.key === "Enter" && state.answers[state.i] != null && e.target.tagName !== "BUTTON") { next(); }
  });
  home();
})();
</script>
</body>
</html>
